<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>عقد طلاق الكتروني💔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Lalezar&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fbf6ea;
    --ink:#2e2320;
    --line:#c9bfa8;
    --pink:#ff6f9c;
    --pink-deep:#e14b7d;
    --stamp:#4a1f22;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#ffd9e6,#ffc2d8 40%,#ffb3cf);
    font-family:'Aref Ruqaa',serif;
    overflow-x:hidden;
    position:relative;
  }
  .heart{position:absolute;bottom:-10%;font-size:22px;opacity:.55;animation:floatUp linear infinite;pointer-events:none;}
  @keyframes floatUp{
    0%{transform:translateY(0) rotate(0deg);opacity:.6;}
    100%{transform:translateY(-115vh) rotate(25deg);opacity:0;}
  }

  /* ---------- ENTRY SCREEN ---------- */
  #entry{
    width:min(90vw,380px);
    background:#fffaf3;
    border-radius:26px;
    padding:38px 26px;
    text-align:center;
    box-shadow:0 20px 40px rgba(120,30,60,.25);
    position:relative;
    z-index:2;
  }
  #entry input{
    width:100%;
    margin-top:22px;
    padding:14px 12px;
    font-family:'Aref Ruqaa',serif;
    font-size:20px;
    text-align:center;
    border:2px solid var(--pink);
    border-radius:14px;
    outline:none;
    background:#fff;
    color:var(--ink);
  }
  #entry input:focus{border-color:var(--pink-deep);}
  #entry button{
    margin-top:20px;
    padding:12px 34px;
    font-family:'Aref Ruqaa',serif;
    font-size:20px;
    font-weight:700;
    border:none;
    border-radius:30px;
    background:var(--pink-deep);
    color:#fff;
    cursor:pointer;
    box-shadow:0 8px 18px rgba(225,75,125,.45);
    transition:transform .15s;
  }
  #entry button:active{transform:scale(.94);}

  /* ---------- PAPER SCREEN ---------- */
  #paperScreen{display:none;width:100%;height:100dvh;align-items:center;justify-content:center;padding:14px;}
  #paper{
    width:min(94vw,480px);
    max-height:96dvh;
    overflow-y:auto;
    background:
      repeating-linear-gradient(var(--paper) 0 34px, #efe6d0 35px, var(--paper) 36px),
      var(--paper);
    border-radius:6px;
    padding:34px 24px 28px;
    box-shadow:0 25px 50px rgba(60,10,30,.35), 0 0 0 1px rgba(0,0,0,.03);
    position:relative;
  }
  #paper::before{
    content:"";
    position:absolute;inset:0;
    border:1px solid rgba(0,0,0,.06);
    border-radius:6px;
    pointer-events:none;
  }
  h1.title{
    text-align:center;
    font-size:30px;
    color:var(--ink);
    margin:4px 0 4px;
    text-decoration:underline;
    text-decoration-color:var(--pink-deep);
    text-underline-offset:8px;
  }
  p.subtitle{
    text-align:center;
    font-size:15px;
    color:#7a6f60;
    margin:0 0 30px;
  }
  .sig-block{margin-top:34px;}
  .sig-label{
    text-align:center;
    font-size:19px;
    color:var(--ink);
    margin-bottom:6px;
  }
  .sig-line{
    position:relative;
    height:110px;
    border-bottom:2px dashed var(--line);
    touch-action:none;
  }
  .fingerprint{
    position:absolute;
    width:56px;height:56px;
    transform:translate(-50%,-50%);
  }
  #fpFixed{left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg);opacity:.85;}
  #fpMoving{left:50%;top:50%;cursor:pointer;transition:none;}

  /* ---------- POPUP ---------- */
  #overlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(40,10,25,.55);
    align-items:center;justify-content:center;
    z-index:10;
    padding:16px;
  }
  #popupCard{
    width:min(88vw,320px);
    background:#fff6f9;
    border-radius:22px;
    padding:22px 18px 18px;
    text-align:center;
    position:relative;
    box-shadow:0 20px 45px rgba(0,0,0,.35);
  }
  #closeBtn{
    position:absolute;top:8px;left:10px;
    background:none;border:none;
    font-size:20px;color:#b56;
    cursor:pointer;
  }
  #popupText{
    font-family:'Lalezar',cursive;
    font-size:24px;
    color:var(--pink-deep);
    margin-top:6px;
  }
  .girlBounce{animation:bounceGirl 1.1s ease-in-out infinite;}
  @keyframes bounceGirl{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
  }
  .stickSwing{transform-origin:70px 78px; animation:swing .6s ease-in-out infinite;}
  @keyframes swing{
    0%,100%{transform:rotate(-14deg);}
    50%{transform:rotate(14deg);}
  }
</style>
</head>
<body>

<div id="entry">
  <input id="nameInput" type="text" placeholder="الاسم الثلاثي" />
  <br>
  <button id="enterBtn">دخول</button>
</div>

<div id="paperScreen">
  <div id="paper">
    <h1 class="title">عقد طلاق الكتروني</h1>
    <p class="subtitle">(مع عدم ذكر الاسباب لكثرها)</p>

    <div class="sig-block">
      <div class="sig-label">توقيع السيدة الفاضلة المؤدبة</div>
      <div class="sig-line">
        <svg id="fpFixed" class="fingerprint" viewBox="0 0 100 100">
          <g fill="none" stroke="#4a1f22" stroke-width="2.4" stroke-linecap="round">
            <ellipse cx="50" cy="52" rx="9" ry="13"/>
            <ellipse cx="50" cy="52" rx="16" ry="22"/>
            <path d="M28 48 Q50 24 72 48"/>
            <path d="M26 60 Q50 84 74 60"/>
            <ellipse cx="50" cy="52" rx="28" ry="37" stroke-dasharray="60 14"/>
          </g>
        </svg>
      </div>
    </div>

    <div class="sig-block">
      <div class="sig-label">توقيع السيد النوتي جدًا</div>
      <div class="sig-line" id="escapeZone">
        <svg id="fpMoving" class="fingerprint" viewBox="0 0 100 100">
          <g fill="none" stroke="#4a1f22" stroke-width="2.4" stroke-linecap="round">
            <ellipse cx="50" cy="52" rx="9" ry="13"/>
            <ellipse cx="50" cy="52" rx="16" ry="22"/>
            <path d="M28 48 Q50 24 72 48"/>
            <path d="M26 60 Q50 84 74 60"/>
            <ellipse cx="50" cy="52" rx="28" ry="37" stroke-dasharray="60 14"/>
          </g>
        </svg>
      </div>
    </div>
  </div>
</div>

<div id="overlay">
  <div id="popupCard">
    <button id="closeBtn">✕</button>
    <svg class="girlBounce" width="140" height="120" viewBox="0 0 140 120">
      <circle cx="60" cy="40" r="20" fill="#ffd9b3"/>
      <path d="M40 30 Q60 8 80 30 Q80 18 60 15 Q40 18 40 30Z" fill="#5b3a29"/>
      <circle cx="34" cy="42" r="7" fill="#5b3a29"/>
      <circle cx="86" cy="42" r="7" fill="#5b3a29"/>
      <circle cx="50" cy="42" r="2.4" fill="#2e2320"/>
      <circle cx="70" cy="42" r="2.4" fill="#2e2320"/>
      <circle cx="47" cy="49" r="4" fill="#ff9db8" opacity=".7"/>
      <circle cx="73" cy="49" r="4" fill="#ff9db8" opacity=".7"/>
      <path d="M53 50 Q60 55 67 50" stroke="#2e2320" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M42 60 Q60 105 78 60 Z" fill="#ff6f9c"/>
      <g class="stickSwing">
        <line x1="70" y1="78" x2="105" y2="45" stroke="#8a5a2e" stroke-width="4" stroke-linecap="round"/>
      </g>
    </svg>
    <div id="popupText">يعني كنت مستعد تبصم؟</div>
  </div>
</div>

<script>
  // floating hearts on entry screen
  for(let i=0;i<10;i++){
    const h=document.createElement('div');
    h.className='heart';
    h.textContent='💗';
    h.style.left=Math.random()*100+'vw';
    h.style.animationDuration=(6+Math.random()*6)+'s';
    h.style.animationDelay=(Math.random()*6)+'s';
    h.style.fontSize=(14+Math.random()*16)+'px';
    document.body.appendChild(h);
  }

  document.getElementById('enterBtn').addEventListener('click',()=>{
    const name=document.getElementById('nameInput').value.trim();
    if(!name) return;
    document.getElementById('entry').style.display='none';
    document.getElementById('paperScreen').style.display='flex';
  });

  const zone=document.getElementById('escapeZone');
  const icon=document.getElementById('fpMoving');
  const overlay=document.getElementById('overlay');
  let attempts=0, cooldown=false;
  const THRESHOLD=70, TRIES_TO_POPUP=5;

  function reposition(px,py){
    const rect=zone.getBoundingClientRect();
    const size=56;
    let best=null,bestDist=-1;
    for(let i=0;i<12;i++){
      const x=Math.random()*(rect.width-size)+size/2;
      const y=Math.random()*(rect.height-size)+size/2;
      const d=Math.hypot(x-px,y-py);
      if(d>bestDist){bestDist=d;best={x,y};}
    }
    icon.style.left=best.x+'px';
    icon.style.top=best.y+'px';
    icon.style.transform='translate(-50%,-50%)';
  }

  function handlePointer(e){
    const rect=zone.getBoundingClientRect();
    const px=(e.clientX ?? e.touches?.[0]?.clientX)-rect.left;
    const py=(e.clientY ?? e.touches?.[0]?.clientY)-rect.top;
    if(px===undefined||py===undefined) return;
    const iconRect=icon.getBoundingClientRect();
    const icx=iconRect.left+iconRect.width/2-rect.left;
    const icy=iconRect.top+iconRect.height/2-rect.top;
    const dist=Math.hypot(px-icx,py-icy);
    if(dist<THRESHOLD && !cooldown){
      cooldown=true;
      setTimeout(()=>cooldown=false,140);
      reposition(px,py);
      attempts++;
      if(attempts>=TRIES_TO_POPUP){
        attempts=0;
        overlay.style.display='flex';
      }
    }
  }

  zone.addEventListener('pointerdown',handlePointer);
  zone.addEventListener('pointermove',handlePointer);
  zone.addEventListener('touchstart',handlePointer,{passive:true});
  zone.addEventListener('touchmove',handlePointer,{passive:true});

  document.getElementById('closeBtn').addEventListener('click',()=>overlay.style.display='none');
  overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.style.display='none'; });
</script>
</body>
</html>
